  <h2>📦 Cadastro de Produto</h2>

  <p class="subtitulo">Preencha os dados para cadastrar um novo produto</p>

  <form id="formProduto">

    <label for="nome">Nome do produto</label>
    <input type="text" id="nome" placeholder="Ex: Mouse Gamer" required>

    <label for="preco">Preço</label>
    <input type="text" id="preco" placeholder="Ex: 1,50" required>

    <button type="submit">Cadastrar</button>

  </form>

</body>
